# Windows build: x64 VST3 with clang-cl (as the local xwin cross-build), validated with pluginval.
# Runs on every push to main and on version tags (also manually: `gh workflow run windows.yml`);
# the zip is uploaded as a build artifact. macos.yml builds the Mac version alongside it.
name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-2022
    env:
      PLUGINVAL_VERSION: v1.0.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build plugin
        run: |
          cmake -S . -B build/win -G "Visual Studio 17 2022" -A x64 -T ClangCL
          cmake --build build/win --config Release -j3 --target LyraTune_VST3

      - name: Check binary
        run: |
          B="build/win/LyraTune_artefacts/Release/VST3/Lyra Tune.vst3/Contents/x86_64-win/Lyra Tune.vst3"
          test -f "$B"
          file "$B" || true

      - name: Validate (pluginval)
        run: |
          curl -sSfL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Windows.zip"
          unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 5 --validate-in-process --timeout-ms 600000 \
            --validate "build/win/LyraTune_artefacts/Release/VST3/Lyra Tune.vst3"

      - name: Package
        run: |
          V=$(sed -n 's/^project(LyraTune VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          P=pkg
          mkdir -p $P
          cp -R "build/win/LyraTune_artefacts/Release/VST3/Lyra Tune.vst3" $P/
          rm -f "$P/Lyra Tune.vst3/Contents/Resources/moduleinfo.json"
          cp -R LICENSE THIRD_PARTY_NOTICES.md licenses $P/
          cp packaging/INSTALL-windows.txt $P/INSTALL.txt
          (cd $P && 7z a -tzip -r "../LyraTune-$V-win-x64-vst3.zip" . > /dev/null)
          sha256sum "LyraTune-$V-win-x64-vst3.zip"
          echo "ZIP=LyraTune-$V-win-x64-vst3.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: lyratune-windows
          path: ${{ env.ZIP }}
          if-no-files-found: error
